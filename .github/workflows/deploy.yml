name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Assemble a clean static site folder containing only HTML/CSS/JS assets.
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp 404.html _site/
          cp ip-lookup.html _site/
          cp privacy.html _site/
          cp tools.html _site/
          cp blog.html _site/
          cp blog-post.html _site/
          cp styles.css _site/
          cp app.js _site/
          cp posts.js _site/
          cp sitemap.xml _site/ 2>/dev/null || true
          cp robots.txt _site/ 2>/dev/null || true
          cp favicon.ico _site/ 2>/dev/null || true
          touch _site/.nojekyll
          ls -la _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
