  <script>
    window.initPage = function () {
      const posts = window.POSTS || [];
      document.getElementById("post-list").innerHTML = posts.map(p => `
        <a href="blog-post.html?slug=${encodeURIComponent(p.slug)}" class="post-card">
          <div class="post-meta">
            <span class="cat">${p.category}</span>
            <span class="read">${ICONS.clock}<span>${p.readTime}</span></span>
          </div>
          <h2>${p.title}</h2>
          <p>${p.excerpt}</p>
          <span class="read-more">Read more ${ICONS.arrowRight}</span>
        </a>`).join("");
    };
  </script>
</body>
